pluginGroup = io.github.mnaami.environmentswitcher
pluginName = Environment Switcher
pluginVersion = 1.1.1

# IntelliJ Platform
platformType = IU
platformVersion = 2024.2
pluginSinceBuild = 242

# Kotlin stdlib comes from the platform
kotlin.stdlib.default.dependency = false
org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
org.gradle.configuration-cache = false
# compile-only dependency for PyCharm run configuration support
pythonPlugin = PythonCore:242.20224.300
goPlugin = org.jetbrains.plugins.go:242.20224.300
phpPlugin = com.jetbrains.php:242.20224.427
