name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Package
        run: ./gradlew buildPlugin --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: build/distributions/*.zip

  verify:
    # One IDE per job: a runner has no room to download the whole set at once,
    # which is what made the single-job verification fail.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ide: [IU, PY, WS, GO, PS, RM]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify against ${{ matrix.ide }}
        run: ./gradlew verifyPlugin -PverifyIde=${{ matrix.ide }}:${{ vars.VERIFY_IDE_VERSION || '2026.2.3' }} --no-daemon
