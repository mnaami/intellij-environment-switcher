name: Release

# Publishes to JetBrains Marketplace and attaches the zip to the GitHub Release
# when a version tag is pushed. Requires the repository secret PUBLISH_TOKEN
# (a JetBrains Marketplace permanent token). Signing is optional: set
# CERTIFICATE_CHAIN, PRIVATE_KEY and PRIVATE_KEY_PASSWORD to enable it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches pluginVersion
        run: |
          VERSION=$(grep '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d ' ')
          [ "v$VERSION" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$VERSION"; exit 1; }

      - name: Build, test and verify
        run: ./gradlew build verifyPlugin --no-daemon

      - name: Package
        run: ./gradlew buildPlugin --no-daemon

      - name: Publish to JetBrains Marketplace
        if: ${{ secrets.PUBLISH_TOKEN != '' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin --no-daemon

      - name: Attach zip to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk '/^## \['"${GITHUB_REF_NAME#v}"'\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Environment Switcher ${GITHUB_REF_NAME#v}" --notes "$NOTES"
          gh release upload "$GITHUB_REF_NAME" build/distributions/*.zip --clobber
